<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mi Hucha | Mi Tesoro</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
body { font-family: 'Be Vietnam Pro', sans-serif; }
.font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>

<body class="bg-surface text-on-background min-h-screen">

<header class="fixed top-0 w-full z-40 rounded-b-3xl bg-white/70 backdrop-blur-xl shadow-xl">
<div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container"></div>
<h1 class="font-headline font-extrabold text-xl text-blue-700">Mi Hucha</h1>
</div>
</div>
</header>

<main class="pt-28 pb-12 px-6 max-w-7xl mx-auto">

<section class="mb-10">
<h2 id="greeting" class="font-headline text-3xl font-extrabold mb-2">¡Hola!</h2>
<p>¡Tu Hucha digital crece cada día!</p>
</section>

<script>
// 👤 sesión
const username = localStorage.getItem('username') || 'Explorador';
const familyCode = localStorage.getItem('familyId'); // 👈 CLAVE

document.getElementById('greeting').textContent = `¡Hola, ${username}! 👋`;

async function loadDashboard() {
    try {
        const res = await fetch(`http://localhost:3000/api/dashboard/${familyCode}`);
        const data = await res.json();

        const { currentSavings, goalProgress, goalTarget } = data;

        const percentage = Math.round((goalProgress / goalTarget) * 100);

        document.getElementById('percentage').textContent = `${percentage}%`;
        document.getElementById('goalAmount').textContent =
            `💰${goalProgress.toFixed(2)}€ / 💰${goalTarget}€`;

        document.getElementById('progressBar').style.width = `${percentage}%`;
        document.getElementById('totalSavings').textContent =
            `💰${currentSavings.toFixed(2)}€`;

    } catch (error) {
        console.error("Error cargando dashboard:", error);
    }
}

loadDashboard();
</script>

<div class="grid grid-cols-1 md:grid-cols-12 gap-6">

<div class="md:col-span-8 bg-blue-600 text-white p-8 rounded-xl">
<h3>AHORRO TOTAL</h3>
<div id="totalSavings" class="text-5xl font-bold">💰0.00€</div>
</div>

<div class="md:col-span-4 bg-yellow-300 p-8 rounded-xl">
<h3>Meta</h3>
<div id="percentage">0%</div>
<div id="goalAmount">💰0€ / 💰0€</div>
<div class="w-full bg-gray-300 h-4 mt-2 rounded">
<div id="progressBar" class="bg-black h-4 rounded" style="width:0%"></div>
</div>
</div>

</div>

</main>
</body>
</html>
