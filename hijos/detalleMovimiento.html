<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-[#f9f5ff] dark:bg-slate-950 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#f2efff] dark:hover:bg-slate-800 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="text-[#2E5BFF] dark:text-blue-400 font-bold text-lg font-['Plus_Jakarta_Sans']">Detalle del Movimiento</h1>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#2E5BFF] dark:text-blue-400">notifications</span>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a smiling young person with soft natural lighting and a warm, clean studio background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY7fEII3RJoXmPaeDnDfH9TuuX9xuGdDzv2H0nkfInGU1vkMILc1Hozrxe2TYk9nVfyQO3R4KYsKwSxvvBFw4NUGGBDFRi-IKf2BG-MxCO3qnDiVydXID1mWzEHMu6mQAIcF3iBP77ARiaPQCxZLXCyFISS7UPQkqEyCBV5HgByY3ipz5bAY78ynFr6rJOci27F5tTHMAJo6tmYm6sVwJAjDoUFKqgQXJYre-ohFEOZYzghP6LST_dhby5Vmw2_u9dlpRGp2g3zeR6"/>
</div>
</div>
</header>
<main class="w-full max-w-md px-6 pt-8 pb-32">
<!-- Transaction Identity Section (Editorial Asymmetry) -->
<div class="flex flex-col items-center mb-12 relative">
<div class="w-32 h-32 rounded-xl bg-primary-container flex items-center justify-center text-on-primary-container shadow-xl relative z-10">
<span class="material-symbols-outlined text-6xl" data-icon="card_giftcard" style="font-variation-settings: 'FILL' 1;">card_giftcard</span>
</div>
<!-- Decorative circle behind icon for depth -->
<div class="absolute w-40 h-40 bg-secondary-container opacity-30 rounded-full blur-3xl -top-4"></div>
<div class="mt-8 text-center">
<span class="text-on-surface-variant font-medium text-sm font-label tracking-wider uppercase">MONTO TOTAL</span>
<div class="text-5xl font-black text-on-surface mt-1 tracking-tight">
<span class="text-secondary font-bold">+💰</span>15.00
                </div>
</div>
</div>
<!-- Bento Grid Styled Info Cards -->
<div class="grid grid-cols-2 gap-4">
<!-- Category Card -->
<div class="col-span-2 bg-surface-container-lowest p-6 rounded-lg shadow-[0_4px_20px_rgba(43,42,81,0.03)] border border-outline-variant/10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="category" style="font-variation-settings: 'FILL' 1;">category</span>
</div>
<div>
<p class="text-xs text-on-surface-variant font-medium uppercase">Categoría</p>
<p class="text-lg font-bold text-on-surface">Mesada</p>
</div>
</div>
</div>
<!-- Date Card -->
<div class="bg-surface-container-lowest p-6 rounded-lg shadow-[0_4px_20px_rgba(43,42,81,0.03)] border border-outline-variant/10">
<div class="flex flex-col gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="calendar_today">calendar_today</span>
<div>
<p class="text-xs text-on-surface-variant font-medium uppercase">Fecha</p>
<p class="text-base font-bold text-on-surface">24 Oct, 2023</p>
</div>
</div>
</div>
<!-- Type Card -->
<div class="bg-surface-container-lowest p-6 rounded-lg shadow-[0_4px_20px_rgba(43,42,81,0.03)] border border-outline-variant/10">
<div class="flex flex-col gap-2">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="account_balance_wallet">account_balance_wallet</span>
<div>
<p class="text-xs text-on-surface-variant font-medium uppercase">Tipo</p>
<p class="text-base font-bold text-on-surface">Ingreso</p>
</div>
</div>
</div>
<!-- Description Card -->
<div class="col-span-2 bg-surface-container-low p-6 rounded-lg relative overflow-hidden">
<div class="relative z-10">
<p class="text-xs text-on-surface-variant font-medium uppercase mb-2">Descripción</p>
<p class="text-lg font-medium text-on-surface leading-relaxed">
                        "From Mom &amp; Dad for cleaning the room"
                    </p>
</div>
<!-- Subtle texture overlay -->
<div class="absolute top-0 right-0 w-24 h-24 bg-primary-container/10 rounded-full -mr-8 -mt-8 blur-2xl"></div>
</div>
</div>
<!-- Actions -->
<div class="mt-12 flex flex-col gap-4">
<button class="w-full py-5 bg-primary text-on-primary rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined">receipt_long</span>
                Ver Recibo Digital
            </button>
<button class="w-full py-4 bg-transparent text-primary font-bold text-base hover:bg-primary-container/10 rounded-xl transition-colors">Volver a la lista</button>
</div>
</main>
<!-- Bottom Navigation suppressed as per "The Destination Rule" for sub-pages / transactional screens, but including a focused return action if needed. However, instructions mandate suppressing for focused journeys. -->
<!-- Backdrop for elevation effect -->
<div class="fixed bottom-0 left-0 w-full h-24 bg-gradient-to-t from-surface to-transparent pointer-events-none"></div>
