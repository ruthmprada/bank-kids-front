    <style>
        body {

            background-color: #f9f5ff;

        h1, h2, h3 {

        }

            background: linear-gradient(135deg, #0846ed 0%, #859aff 100%);

    <style>

             src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3wlU5KwFekWD4HiHTgpv54lCRNvNeVq6oilToR8kbfEU6rDL4Dwn7xQ-N4_GKoBBWdXMVYQQ2rqPzB8P81h7BFxwPU2_wfkk1vHhSwlrz9n4gBlt7USRw8wV2x5EvYKn5tPGEdhgYzeVZPagk69Te46oa8ltNpsyFGBBdKnj2eIwyCrlQ8Gzkb6oPX-eoBjEPCS7y-CFMdt1KqQH6Sue1ju90Op3m_V-pEfAeHfuEd0qQwkZr6DTgDRAeTAWqIUuSjTUH5ve_C8bQ"/>

    <div class="flex items-center gap-4">

        <span class="material-symbols-outlined text-[#2E5BFF]">notifications</span>

  <main class="px-6 max-w-4xl mx-auto space-y-8 mt-4">
    <!-- Dashboard Title -->
    <section>
      <h1 class="text-on-surface font-black text-3xl tracking-tight">Control Parental</h1>
      <p class="text-on-surface-variant text-sm mt-1">Gestiona las finanzas de tu familia con un toque.</p>
    </section>
    <!-- Summary Card (Editorial Play) -->
    <section class="relative overflow-hidden editorial-gradient p-8 rounded-lg text-on-primary shadow-xl">
      <div class="relative z-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <span class="text-on-primary/80 font-medium tracking-wide uppercase text-xs">Saldo Total Familiar</span>
          <div class="flex items-baseline gap-2 mt-1">
            <span class="text-4xl font-extrabold font-headline">4,250 €</span>
            <span class="text-xl font-bold opacity-70">.00</span>
          </div>
        </div>
        <div class="flex -space-x-4">
          <div class="w-12 h-12 rounded-full border-4 border-[#0846ed] overflow-hidden bg-white">
            <img alt="Leo"
                 data-alt="Portrait of a young boy smiling with a natural outdoor background and warm lighting"
                 src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOMGJt6GXirRM6-Zu8Yc7N8b9CKuSL8-cD4pp_6InKBJyJ0VnYznfLqKxBVwAlTXZMw5Plbbh1C268aUx5sC4omyha3UYiupbbVdZpLmARq7O1VYdznq-3Mo1vBeQnk4am8vt0zNfOe-5Tzh8MXXG78Op9nRyntoY5yU1veC2xNxBkeHCtcLqbW_KbdeFugTOmP8XvwCrsUambvp3lyp-mAGkZKv5cROHfgQBd9UlkvHwItK9GQ0vCefFPJKhnrgp01lfRgu8_JHwy"/>

          <div class="w-12 h-12 rounded-full border-4 border-[#0846ed] overflow-hidden bg-white">
            <img alt="Sofía" data-alt="Portrait of a young girl with curly hair laughing in a garden setting"
                 src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwk2fD29bC9GE2IPVzFe2Y3LWlH8SE10g1aIXXONeCKqxPrR2VEblAkrVVU2GommM-E2njGi8Y5WheLHhDLnWthinikUHh3jdAiz-CNpGLkb0MWbPZE38dXsh6ED7oPlqtFcOPyesx3NzT_VNXG_Zn0eB2K-69a8wcwHmnpp8kywfxCBWsTJ9oOyKGKAEuaBCPJHXA8KE9TyzfclHZA8aX2QmVJPWYrGFKwN29Opwj3cG-wgJmtSmXbvSXNf11ILSV1QOus83nyR7b"/>

          <div class="w-12 h-12 rounded-full border-4 border-[#0846ed] flex items-center justify-center bg-primary-container text-on-primary-container font-bold text-sm">
            +1
          </div>
        </div>
      </div>
      <!-- Decorative "Playground" shapes -->
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
      <div class="absolute -left-10 -top-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-xl"></div>

    <!-- Child Accounts Grid -->

      <div class="flex justify-between items-center">
        <h2 class="text-on-surface font-bold text-xl">Tus Hijos</h2>
        <button class="text-primary font-bold text-sm hover:underline">Ver todos</button>
      </div>
      <div id="childrenList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>        
    </section>
    <!-- Global Activity Feed (Bento Style) -->
    <section class="space-y-4">
      <h2 class="text-on-surface font-bold text-xl">Actividad Reciente</h2>
       <div id="activityList" class="bg-surface-container-low rounded-lg p-2 space-y-2"></div>
    </section>

  <!-- BottomNavBar Execution -->
  <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl docked full-width bottom-0 rounded-t-[3rem] shadow-[0_-4px_20px_rgba(43,42,81,0.05)]">
