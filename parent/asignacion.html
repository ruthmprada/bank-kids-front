<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Asignar Dinero | PiggyBank</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be_Vietnam_Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
        <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "outline-variant": "#aba9d7",
                            "on-error": "#ffefef",
                            "outline": "#74739e",
                            "error-dim": "#a70138",
                            "tertiary-fixed": "#feb700",
                            "surface-container-high": "#e2dfff",
                            "on-tertiary-fixed-variant": "#5f4200",
                            "surface": "#f9f5ff",
                            "on-tertiary-container": "#533a00",
                            "surface-variant": "#dcd9ff",
                            "background": "#f9f5ff",
                            "primary-fixed-dim": "#718bff",
                            "secondary-fixed-dim": "#4eeeb9",
                            "on-secondary-fixed": "#004935",
                            "error-container": "#f74b6d",
                            "surface-tint": "#0846ed",
                            "surface-bright": "#f9f5ff",
                            "on-primary": "#f2f1ff",
                            "on-surface": "#2b2a51",
                            "error": "#b41340",
                            "on-tertiary-fixed": "#392700",
                            "inverse-on-surface": "#9a99c6",
                            "surface-container": "#e9e5ff",
                            "on-error-container": "#510017",
                            "on-secondary-fixed-variant": "#00694d",
                            "on-primary-fixed-variant": "#00207e",
                            "tertiary-container": "#feb700",
                            "surface-dim": "#d2d0ff",
                            "on-secondary-container": "#005e44",
                            "primary-fixed": "#859aff",
                            "on-secondary": "#c7ffe4",
                            "secondary-fixed": "#60fcc6",
                            "tertiary": "#785500",
                            "surface-container-lowest": "#ffffff",
                            "surface-container-low": "#f2efff",
                            "secondary-container": "#60fcc6",
                            "on-surface-variant": "#585781",
                            "surface-container-highest": "#dcd9ff",
                            "on-primary-fixed": "#000000",
                            "primary-container": "#859aff",
                            "on-tertiary": "#fff1de",
                            "secondary-dim": "#005b43",
                            "primary": "#0846ed",
                            "on-background": "#2b2a51",
                            "tertiary-fixed-dim": "#ecaa00",
                            "on-primary-container": "#001867",
                            "primary-dim": "#003cd3",
                            "inverse-surface": "#0a082f",
                            "tertiary-dim": "#694a00",
                            "inverse-primary": "#6d88ff",
                            "secondary": "#00694d"
                        },
                        "borderRadius": {
                                "DEFAULT": "1rem",
                                "lg": "2rem",
                                "xl": "3rem",
                                "full": "9999px"
                        },
                        "fontFamily": {
                                "headline": ["Plus Jakarta Sans"],
                                "body": ["Be Vietnam Pro"],
                                "label": ["Plus Jakarta Sans"]
                        }
                    },
                },
            }
        </script>
        <style>
                .material-symbols-outlined {
                    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
                }
                body {
                    font-family: 'Be Vietnam Pro', sans-serif;
                    background-color: #f9f5ff;
                }
                h1, h2, h3 {
                    font-family: 'Plus Jakarta Sans', sans-serif;
                }
                .glass-panel {
                    background: rgba(255, 255, 255, 0.7);
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                }
        </style>
        <style>
            body {
            min-height: max(884px, 100dvh);
            }
        </style>
    </head>
    <body class="bg-surface text-on-surface selection:bg-primary-container min-h-screen pb-32">
    <!-- Top Navigation Anchor -->
        <header class="bg-[#f9f5ff] dark:bg-slate-950 flex justify-between items-center w-full px-6 py-4 fixed top-0 z-50">
            <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
            <img alt="User profile avatar" class="w-full h-full object-cover" data-alt="Portrait of a friendly father smiling, high-end photography, warm lighting, soft depth of field" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzp-k5pwOwTqSz3Eq7M5vTV-ZktXPyXEcH2C9JfNbyJwONeuAZg6nowcWznoJemREnlVPE4y7k_5-v4MfNbxP4YYhzr-DrelJTtZwbAmCbOF7K-zLCUeYStXbRo02w-w7kjCCuicKpH1JGvcJOJoTpGcEiMkn8LOsFlTkSrDNEMeSmBjA4k2AeB6qWdoGV6sFyTRLCN8fFsOH4hRW6U0BOWyzOQbzyyNY0WxAXwMmPseeu_StQJDf_bJYKbM4e9N7vnL5suOZSYo0f"/>
            </div>
            <h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg text-[#2E5BFF] dark:text-blue-400">PiggyBank</h1>
            </div>
            <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-[#f2efff] dark:hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-[#2E5BFF] dark:text-blue-400" data-icon="notifications">notifications</span>
            </button>
        </header>
        <main class="pt-24 px-6 max-w-2xl mx-auto">
            <!-- Editorial Header Section -->
            <section class="mb-10">
                <span class="text-primary font-bold tracking-widest text-xs uppercase mb-2 block">Portal de Padres</span>
                <p class="text-xs text-on-surface-variant">Solo accesible para padres o tutores.</p>
                <h2 class="text-4xl font-extrabold text-on-surface tracking-tight mb-2">Asignar Dinero</h2>
                <p class="text-on-surface-variant font-medium">Crea una nueva transacción para las cuentas de tus hijos.</p>
            </section>
            <!-- Transaction Form Container -->
            <form class="space-y-6" id="transactionForm">
                <!-- Child Selection & Type Toggle (Asymmetric Layout) -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-7 bg-surface-container-low rounded-lg p-6 flex flex-col justify-center">
            <label class="block text-sm font-bold text-on-surface-variant mb-4 font-headline">Selecciona un Hijo</label>
            <div class="flex gap-4">
            <label class="relative flex-1 cursor-pointer group">
            <input checked="" class="peer sr-only" name="child" type="radio"/>
            <div class="flex flex-col items-center p-4 rounded-lg bg-surface-container-lowest peer-checked:bg-primary-container/20 ring-2 ring-transparent peer-checked:ring-primary transition-all">
            <div class="w-12 h-12 rounded-full overflow-hidden mb-2">
            <img alt="Leo" data-alt="Close up portrait of a young boy named Leo smiling, bright natural lighting, colorful background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxSEu_1Zb41jgtLpcI0hAnniaMLqzulc30Hrf76MglG-QR0V-jDQT7crPJxklMstbVdai2N1pmRcO6smc02ntf-tos7kkHUJOQzH3o2DUGIFFOIP5Of7bK_eAvUGhnsBM2ab7OxdwRdhPLMOWexV5GCgUraZ1FhZucw6jbx1WWnVWHxUg6bNl5OCeekXDGdJi-7aCehBDgvVeCdfzjmGaa3aWGEfenabzTBgDEAZGg2P-4r9OT4yqtBIjoMRa7VNmlTh6J6Qf2nBuG"/>
            </div>
            <span class="font-bold text-on-surface">Leo</span>
            </div>
            </label>
            <label class="relative flex-1 cursor-pointer group">
            <input class="peer sr-only" name="child" type="radio"/>
            <div class="flex flex-col items-center p-4 rounded-lg bg-surface-container-lowest peer-checked:bg-primary-container/20 ring-2 ring-transparent peer-checked:ring-primary transition-all">
            <div class="w-12 h-12 rounded-full overflow-hidden mb-2">
            <img alt="Sofía" data-alt="Portrait of a young girl named Sofia with braided hair, soft outdoor lighting, gentle smile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWBJMU0suYKn7n1EjMwiEayNeiTUD82eYpYPEjWmC1a-DAZL3Lfu6mpGmVRv6ETUkhAsWdxOsa0qHBF1EUc9ZSpIuq-VwHqA2o4AT1x3ObCcPnG62gri4tTxcZ01jV3nJIbXCupkoiijQspZFfGdCvnfpL-E1bmfrPVn43iF_X7mTyHRHSoXc2w0WzyPvtqr1r_GXfT-HGZwVdgJkk-tknqvC3gZFUb7KNSN8c-zeuS6ZAp6P1RAMx-rOYcitTJ5MYPgmllXJ6QOJ7"/>
            </div>
            <span class="font-bold text-on-surface">Sofía</span>
            </div>
            </label>
            </div>
            </div>
            <div class="md:col-span-5 bg-surface-container-low rounded-lg p-6">
            <label class="block text-sm font-bold text-on-surface-variant mb-4 font-headline">Tipo de Transacción</label>
            <div class="flex flex-col gap-3">
            <label class="flex items-center gap-3 p-3 rounded-xl bg-surface-container-lowest cursor-pointer group">
            <input checked="" class="w-5 h-5 text-primary border-none bg-surface-container-highest focus:ring-0" name="type" type="radio"/>
            <span class="font-semibold text-on-surface">Ingreso</span>
            <span class="material-symbols-outlined ml-auto text-secondary" data-icon="south_west">south_west</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-xl bg-surface-container-lowest cursor-pointer group">
            <input class="w-5 h-5 text-primary border-none bg-surface-container-highest focus:ring-0" name="type" type="radio"/>
            <span class="font-semibold text-on-surface">Gasto</span>
            <span class="material-symbols-outlined ml-auto text-error" data-icon="north_east">north_east</span>
            </label>
            </div>
            </div>
                </div>
                <!-- Amount Input (Large Impact) -->
                <div class="bg-surface-container-low rounded-lg p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-8 opacity-10">
            <span class="material-symbols-outlined text-9xl" data-icon="payments">payments</span>
            </div>
            <label class="block text-sm font-bold text-on-surface-variant mb-4 font-headline">Monto</label>
            <div class="flex items-center">
            <input name="amount" required min="0.01" class="bg-transparent border-none text-5xl font-black text-on-surface focus:ring-0 w-full p-0 placeholder:text-surface-container-highest" placeholder="0.00" step="0.01" type="number"/>
            <span class="text-4xl font-extrabold text-primary ml-2">€</span>
            </div>
                </div>
                <!-- Category Selection -->
                <div class="bg-surface-container-low rounded-lg p-6">
                    <label class="block text-sm font-bold text-on-surface-variant mb-6 font-headline">Categoría</label>
                    <div class="grid grid-cols-4 sm:grid-cols-8 gap-4">
                    <button data-category="Comida" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="fastfood">Comida Rápida</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Comida</span>
                    </button>
                    <button data-category="Juegos" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
                            <span class="material-symbols-outlined text-white" data-icon="videogame_asset">Juegos</span>
                        </div>
                        <span class="text-[10px] font-bold text-primary">Juegos</span>
                    </button>
                    <button data-category="Aprender" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="school">Aprender</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Aprender</span>
                    </button>
                    <button data-category="Regalo" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="redeem">Regalo</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Regalo</span>
                    </button>
                    <button data-category="Metas" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="savings">Metas</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Metas</span>
                    </button>
                    <button data-category="Entretenimiento" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="movie">Entretenimiento</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Entretenimiento</span>
                    </button>
                    <button data-category="Compras" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="shopping_bag">Compras</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Compras</span>
                    </button>
                    <button data-category="Otro" class="flex flex-col items-center gap-2 group">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-lowest flex items-center justify-center group-hover:bg-primary-container/30 transition-all border-2 border-transparent hover:border-primary">
                            <span class="material-symbols-outlined text-primary" data-icon="more_horiz">Otro</span>
                        </div>
                        <span class="text-[10px] font-bold text-on-surface-variant">Otro</span>
                    </button>
                    </div>
                </div>
                <!-- Memo/Description -->
                <div class="bg-surface-container-low rounded-lg p-6">
                    <label class="block text-sm font-bold text-on-surface-variant mb-4 font-headline">Memo / Descripción</label>
                    <textarea name="memo" class="w-full bg-surface-container-lowest border-none rounded-xl p-4 focus:ring-2 focus:ring-primary-container text-on-surface placeholder:text-outline-variant font-medium" placeholder="¿Para qué es esto? (p.ej. Mesada semanal, Regalo de cumpleaños...)" rows="3"></textarea>
                </div>
                <!-- Submit Action -->
                <button type="submit" class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white rounded-xl font-bold text-lg shadow-xl shadow-primary/25 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
                    <span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Confirmar Transacción
                </button>
            </form>
        </main>
        <!-- Bottom Navigation Shell -->
        <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-[0_-4px_20px_rgba(43,42,81,0.05)] rounded-t-[3rem]">
            <a href="dashboardPadres.html" class="flex flex-col items-center justify-center text-[#585781] dark:text-slate-400 px-5 py-2 hover:opacity-80 active:scale-90 duration-150 transition-transform">
                <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-['Be_Vietnam_Pro'] text-[12px] font-medium mt-1">Panel</span>
            </a>
            <a href="asignacion.html" class="flex flex-col items-center justify-center bg-[#f2efff] dark:bg-blue-900/30 text-[#2E5BFF] dark:text-blue-300 rounded-[3rem] px-5 py-2 hover:opacity-80 active:scale-90 duration-150 transition-transform">
                <span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                <span class="font-['Be_Vietnam_Pro'] text-[12px] font-medium mt-1">Transacción</span>
            </a>
            <a href="dashboardPadres.html" class="flex flex-col items-center justify-center text-[#585781] dark:text-slate-400 px-5 py-2 hover:opacity-80 active:scale-90 duration-150 transition-transform">
                <span class="material-symbols-outlined" data-icon="settings">settings</span>
                <span class="font-['Be_Vietnam_Pro'] text-[12px] font-medium mt-1">Configuración</span>
            </a>
        </nav>
      <script src="../js/asignacion.js"></script>
    </body>
</html>
